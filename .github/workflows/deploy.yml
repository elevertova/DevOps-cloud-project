name: AWS Terraform CI/CD

# GitHub Actions workflow for deploying Terraform across environments
# - Dev and UAT run on pushes to non-main branches
# - Prod runs only on `main` when explicitly triggered via `deploy_to_production`

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
    # Manual trigger inputs
    inputs:
      deploy_to_production:
        description: 'Deploy to Production?'
        required: false
        default: 'false'
        type: choice
        options: [false, true]
      destroy:
        description: 'Destroy infrastructure?'
        required: false
        default: 'false'
        type: choice
        options: [false, true]
      environment:
        description: 'Which environment to destroy or deploy?'
        required: true
        default: 'prod'
        type: choice
        options: [dev, uat, prod]

permissions:
  # Allow OIDC id-token for aws-actions/configure-aws-credentials
  id-token: write
  # Read-only access to repository contents for actions/checkout
  contents: read

jobs:
  # Deploy to Dev
  # Runs for non-main branches unless `destroy` is true
  deploy-dev:
    name: Deploy to Dev
    if: github.ref != 'refs/heads/main' && github.event.inputs.destroy != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dev
    steps:
      - uses: actions/checkout@v4
      
      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64').toString()
            );
            console.log(JSON.stringify(payload, null, 2));
      
      - name: Configure AWS Credentials (Dev) - feature/assessment-13-pipeline
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # IAM role to assume (OIDC) for Dev account
          role-to-assume: arn:aws:iam::677123926354:role/GitHubActionsRole
          aws-region: us-west-2
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: terraform init -reconfigure
      - name: Terraform Plan
        run: terraform plan
      - name: Terraform Apply
        run: terraform apply -auto-approve

  # Deploy to UAT
  # Runs after Dev completes for non-main branches
  deploy-uat:
    name: Deploy to UAT
    if: github.ref != 'refs/heads/main' && github.event.inputs.destroy != 'true'
    runs-on: ubuntu-latest
    needs: deploy-dev
    defaults:
      run:
        working-directory: UAT
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials (UAT)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # IAM role to assume (OIDC) for UAT account
          role-to-assume: arn:aws:iam::590951086377:role/GitHubActionsRole
          aws-region: us-west-2
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: terraform init -reconfigure
      - name: Terraform Plan
        run: terraform plan
      - name: Terraform Apply
        run: terraform apply -auto-approve

  # Deploy to Production
  # Only runs on `main` when `deploy_to_production` input is true
  deploy-prod:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main' && github.event.inputs.deploy_to_production == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Prod
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials (Prod)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # IAM role to assume (OIDC) for Prod account
          role-to-assume: arn:aws:iam::330907589313:role/GitHubActionsRole
          aws-region: us-west-2
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: terraform init -reconfigure
      - name: Terraform Plan
        run: terraform plan
      - name: Terraform Apply
        run: terraform apply -auto-approve

  # Destroy job: runs when `destroy` input is true
  # Working directory and assumed role are chosen based on `environment` input
  destroy:
    name: Destroy Infrastructure
    if: github.event.inputs.destroy == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.event.inputs.environment == 'dev' && 'Dev' || github.event.inputs.environment == 'uat' && 'UAT' || 'Prod' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Dynamically select the IAM role to assume for the requested environment
          role-to-assume: >-
            ${{ github.event.inputs.environment == 'dev' && 'arn:aws:iam::677123926354:role/GitHubActionsRole' || 
                github.event.inputs.environment == 'uat' && 'arn:aws:iam::590951086377:role/GitHubActionsRole' || 
                'arn:aws:iam::330907589313:role/GitHubActionsRole' }}
          aws-region: us-west-2
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: terraform init -reconfigure
      - name: Terraform Destroy
        run: terraform destroy -auto-approve
